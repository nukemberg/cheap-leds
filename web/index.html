<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d12">
  <title>MR Star Lights</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <div class="glow" id="glow"></div>
    <h1>MR&nbsp;Star</h1>
    <button id="install" class="install" hidden>Install app</button>
    <button id="power" class="power" aria-pressed="true" aria-label="Power">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
    </button>
  </header>

  <main>
    <p id="unsupported" class="notice" hidden>
      Web Bluetooth not available. Use Chrome on Android or desktop, served over HTTPS or localhost.
    </p>

    <section>
      <div class="row-head">
        <h2>Controllers</h2>
        <button id="add" class="ghost">+ Add</button>
      </div>
      <ul id="devices" class="devices"></ul>
      <p id="empty" class="hint">Tap “Add” and pick a <code>GATT--DEMO</code> device. Repeat for each controller.</p>
    </section>

    <section>
      <h2>Color</h2>
      <div id="swatch" class="swatch"></div>
      <label class="slider">
        <span>Hue</span>
        <input id="hue" type="range" min="0" max="360" step="1" class="hue">
      </label>
      <label class="slider">
        <span>Saturation</span>
        <input id="sat" type="range" min="0" max="100" step="1" class="sat">
      </label>
      <div id="presets" class="presets"></div>
    </section>

    <section>
      <label class="slider">
        <span>Brightness <output id="bri-out"></output></span>
        <input id="bri" type="range" min="1" max="100" step="1">
      </label>
    </section>

    <section>
      <h2>Effects</h2>
      <div id="effects"></div>
      <label class="slider">
        <span>Speed <output id="spd-out"></output></span>
        <input id="spd" type="range" min="0" max="100" step="1">
      </label>
      <label class="toggle"><input id="rev" type="checkbox"> Reverse direction</label>
    </section>

    <details>
      <summary>Setup</summary>
      <label class="slider">
        <span>LED count <output id="len-out"></output></span>
        <input id="len" type="range" min="8" max="300" step="1">
      </label>
      <button id="send-len" class="ghost">Send LED count</button>
    </details>
  </main>
</body>
</html>
